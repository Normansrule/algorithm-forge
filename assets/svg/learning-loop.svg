<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The Algorithm Forge learning loop</title>
<desc id="dsc">Seven steps in a loop - Learn, See, Blocks, Write pseudocode, Auto-check, Nudge, Senior twist - with a token travelling around it.</desc>
