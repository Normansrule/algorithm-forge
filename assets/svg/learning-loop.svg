<rect x=".5" y=".5" width="899" height="449" rx="18" fill="url(#glow)"/>
<text x="28" y="38" font-size="11" fill="#ff8a3d" font-weight="700" letter-spacing="1.4">HOW IT WORKS</text>
<text x="28" y="63" font-size="20" fill="#e8edf5" font-weight="800">One loop, for every algorithm</text>
<g transform="translate(850,14)" opacity=".8"><rect x="0" y="11" width="5" height="10" rx="1.2" fill="#5ab0ff"/><rect x="7" y="7" width="5" height="14" rx="1.2" fill="#5ab0ff" opacity=".8"/><rect x="14" y="2" width="5" height="19" rx="1.2" fill="#ff8a3d"/><text x="-7" y="17" font-size="12" font-weight="700" fill="#7f8ba3" text-anchor="end">Algorithm Forge</text></g>
