<defs><linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121823"/><stop offset="1" stop-color="#0d1117"/></linearGradient><radialGradient id="glow" cx=".12" cy="0" r=".7"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".10"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient></defs>
