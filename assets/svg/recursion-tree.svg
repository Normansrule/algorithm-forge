<g class="k13">
<text x="640" y="120" font-size="11.5" fill="#7f8ba3">level 0 · 1 call of size n</text>
<text x="640" y="138" font-size="14.5" fill="#e8edf5" font-weight="800" class="m">n</text>
<text x="872" y="138" font-size="14.5" fill="#ff8a3d" font-weight="800" text-anchor="end" class="m">= 8</text>
</g>
<g class="k14">
<text x="640" y="192" font-size="11.5" fill="#7f8ba3">level 1 · 2 calls of size n/2</text>
<text x="640" y="210" font-size="14.5" fill="#e8edf5" font-weight="800" class="m">2 × n/2 = n</text>
<text x="872" y="210" font-size="14.5" fill="#ff8a3d" font-weight="800" text-anchor="end" class="m">= 8</text>
</g>
<g class="k15">
<text x="640" y="264" font-size="11.5" fill="#7f8ba3">level 2 · 4 calls of size n/4</text>
<text x="640" y="282" font-size="14.5" fill="#e8edf5" font-weight="800" class="m">4 × n/4 = n</text>
<text x="872" y="282" font-size="14.5" fill="#ff8a3d" font-weight="800" text-anchor="end" class="m">= 8</text>
</g>
<g class="k16">
<text x="640" y="336" font-size="11.5" fill="#7f8ba3">level 3 · 8 calls of size 1</text>
<text x="640" y="354" font-size="14.5" fill="#b4bfd1" font-weight="600" class="m">base case T(1) = 0</text>
<text x="872" y="354" font-size="14.5" fill="#7f8ba3" font-weight="800" text-anchor="end" class="m">= 0</text>
</g>
<g class="k17">
<rect x="24" y="382" width="852" height="64" rx="12" fill="#161d2a" stroke="#ff8a3d" stroke-opacity=".55"/>
<text x="44" y="409" font-size="17" fill="#e8edf5" font-weight="700"><tspan fill="#b4bfd1">n per level × </tspan><tspan fill="#ff8a3d">log₂ n</tspan><tspan fill="#b4bfd1"> levels  =  </tspan><tspan fill="#ff8a3d" font-weight="800">n log₂ n</tspan></text>
<text x="44" y="432" font-size="13" fill="#b4bfd1">here n = 8:  8 × 3 = 24  — so mergesort is Θ(n log n) in every case</text>
<text x="856" y="422" font-size="24" fill="#3ddc97" font-weight="800" text-anchor="end">Θ(n log n)</text>
